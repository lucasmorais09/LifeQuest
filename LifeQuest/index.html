<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F1FA;--frame:#F7FAFE;--surface:#FFFFFF;--mist:#E3EDF9;--mist2:#F0F5FC;--line:#D7E2F0;
  --blue:#3D7BD9;--blue-d:#2B60B2;--blue-l:#A9C6EE;--ink:#1F2C44;--ink2:#5B6B86;--ink3:#93A1B8;
  --ok:#2FA67E;--bad:#D4566A;--gold:#F2B84B;--shadow:0 6px 18px -8px rgba(43,96,178,.28);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1625;--frame:#131D2F;--surface:#1A263B;--mist:#22324C;--mist2:#1B2740;--line:#2B3C58;
  --blue:#6FA3F0;--blue-d:#9BC0F6;--blue-l:#3A5B8C;--ink:#E7EEF8;--ink2:#A8B6CC;--ink3:#7586A2;--shadow:0 6px 18px -8px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1625;--frame:#131D2F;--surface:#1A263B;--mist:#22324C;--mist2:#1B2740;--line:#2B3C58;
  --blue:#6FA3F0;--blue-d:#9BC0F6;--blue-l:#3A5B8C;--ink:#E7EEF8;--ink2:#A8B6CC;--ink3:#7586A2;--shadow:0 6px 18px -8px rgba(0,0,0,.5);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;max-width:412px;height:100%;background:var(--frame);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){.phone{height:min(880px,calc(100% - 48px));border-radius:40px;box-shadow:0 0 0 10px var(--surface),0 0 0 11px var(--line),0 40px 80px -30px rgba(40,80,140,.45)}}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
h1,h2,h3{font-family:"Baloo 2",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
small{color:var(--ink2)}
.hide{display:none!important}
.muted{color:var(--ink2)}

/* ---------- top bars ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;position:sticky;top:0;background:var(--frame);z-index:5}
.bar h2{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--mist)}

/* ---------- buttons, fields ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:700;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{background:var(--blue-d)}
:root[data-theme="dark"] .btn.primary,.btn.primary{color:#fff}
.btn.ghost{background:var(--mist);color:var(--blue-d)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{color:var(--blue-d);font-weight:600;padding:8px 4px}
.link.small{font-size:13px;color:var(--ink2);font-weight:500}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px 4px}
.field input,.field select,.field textarea,.form select,.inp{width:100%;height:50px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-size:16px;outline:none;transition:border-color .15s}
.field textarea{height:110px;padding:12px 14px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus,.form select:focus{border-color:var(--blue)}
.at-wrap{position:relative}
.at-wrap::before{content:"@";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600}
.at-wrap input{padding-left:32px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 4px 10px}
.okmsg{color:var(--ok);font-size:13px;margin:2px 4px 10px}
.hint{display:block;font-size:12.5px;margin:6px 4px 0}
.row2{display:flex;align-items:center;gap:8px}
.row2 b{color:var(--ink3)}
.row2 select{flex:1}
.form{padding:6px 20px 32px}

/* switch */
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:30px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--blue)}
.switch input:checked+i::after{transform:translateX(22px)}
.switch input:focus-visible+i{outline:2.5px solid var(--blue);outline-offset:2px}
.tog-row{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tog-row b{display:block;font-weight:600}
.tog-row small{font-size:12.5px}
.sec{margin:-2px 0 14px;padding:12px;border-radius:14px;background:var(--mist2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk-chip{position:relative}
.chk-chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk-chip span{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink2)}
.chk-chip input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.chk-chip input:focus-visible+span{outline:2.5px solid var(--blue);outline-offset:2px}
.checkrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;margin-bottom:12px;font-weight:600}
.checkrow input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;flex-direction:column;padding:0 28px 26px;position:relative}
.login-top{padding-top:9vh;text-align:center;position:relative}
.hexfield{position:absolute;inset:0 -28px auto;height:300px;pointer-events:none;overflow:hidden}
.hexfield svg{position:absolute;color:var(--blue-l);opacity:.55}
.mark{width:84px;height:84px;margin:0 auto 6px;position:relative}
.brand{font-size:50px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
.tag{margin:0;color:var(--ink2);font-weight:500}
.login-form{margin-top:auto;padding-top:48px}
.login-alt{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;color:var(--ink2);font-size:14px}
.center{text-align:center}

/* ---------- ambits ---------- */
.amb-list{padding:4px 16px 8px;display:flex;flex-direction:column;gap:10px}
.amb-row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:var(--surface);border:2px solid transparent;text-align:left;width:100%;transition:border-color .15s}
.amb-row.on{border-color:var(--c)}
.circ{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:var(--c);position:relative}
.circ.dash{background:transparent;border:2px dashed var(--blue-l);color:var(--blue)}
.amb-row .tx{flex:1;min-width:0}
.amb-row .tx b{display:block;font-size:16px}
.amb-row .tx small{display:block;font-size:13px;line-height:1.35}
.tick{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--c);display:grid;place-items:center;box-shadow:0 0 0 2px var(--c)}
.star{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);flex:none}
.star.on{color:var(--gold)}
.star.on svg{fill:var(--gold)}
.star:disabled{opacity:.3}
.amb-foot{padding:10px 16px 28px}
.prio-note{font-size:13px;text-align:center;color:var(--ink2);margin-bottom:10px}
.intro{padding:0 20px 10px;color:var(--ink2)}

/* ---------- home ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.home-head h2{font-size:21px}
.coin{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:20px;background:var(--surface);font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.coin svg{color:var(--gold)}
.cal{margin:6px 12px 0;background:var(--surface);border-radius:24px;padding:10px 8px 8px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px}
.cal-head h3{text-transform:capitalize}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:stretch;padding:3px 2px;gap:2px;overflow:hidden;text-align:center}
.day:hover{background:var(--mist2)}
.day .dn{align-self:center;width:24px;height:24px;line-height:24px;border-radius:50%;font-size:13px;font-weight:600}
.day.out{opacity:.35}
.day.today .dn{color:var(--blue);font-weight:800;box-shadow:inset 0 0 0 1.5px var(--blue)}
.day.sel{background:var(--mist)}
.day.sel .dn{background:var(--blue);color:#fff;box-shadow:none}
.stripe{display:block;height:11px;border-radius:4px;background:var(--c);color:#fff;font-size:7.5px;line-height:11px;font-weight:700;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.more{font-size:8.5px;color:var(--ink2);font-weight:700;line-height:1}
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 8px}
.acts{padding:0 14px 96px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px 10px 10px;border-left:5px solid var(--c);cursor:pointer}
.act-ic{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;flex:none}
.act-main{flex:1;min-width:0}
.act-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-s{font-size:13px;color:var(--ink2)}
.act-s b{color:var(--c);font-weight:700}
.mini{height:34px;padding:0 14px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:13px;flex:none}
.done-tag{font-size:12.5px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:4px;flex:none}
.live{font-size:12px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.empty{text-align:center;color:var(--ink2);padding:22px 20px;background:var(--surface);border-radius:18px;border:1.5px dashed var(--line)}
.fab{position:absolute;right:18px;bottom:86px;width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(43,96,178,.7);z-index:8}
.fab:hover{background:var(--blue-d)}

/* ---------- tab bar ---------- */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px;flex:none;z-index:9}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:4px 0}
.tabbar button.on{color:var(--blue)}

/* ---------- activity detail ---------- */
.det{padding:4px 20px 30px;text-align:center}
.det .chip{margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:700;font-size:13px}
.det h1{font-size:28px;margin-bottom:4px}
.det .meta{color:var(--ink2);font-size:14px}
.clock{position:relative;width:236px;height:236px;margin:22px auto 12px}
.clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
.clock .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock .t{font-family:"Baloo 2",system-ui;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock .l{font-size:13px;color:var(--ink2);font-weight:600}
.clock.over .t{color:var(--bad)}
.clock.done .t{color:var(--ok)}
.endline{font-weight:600;margin-bottom:22px}
.endline span{color:var(--ink2);font-weight:500}
.btns{display:flex;flex-direction:column;gap:10px}
.info-list{margin:18px 0 0;text-align:left;background:var(--surface);border-radius:18px;padding:4px 16px}
.info-list div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-list div:last-child{border-bottom:0}
.info-list span{color:var(--ink2)}

/* ---------- proof ---------- */
.proof{padding:6px 22px 28px}
.proof-art{height:200px;border-radius:26px;background:var(--mist);display:grid;place-items:center;margin:6px 0 20px;position:relative;overflow:hidden}
.proof h2{margin-bottom:8px}
.proof p{color:var(--ink2);margin:0 0 14px}
.ex{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px}
.ex svg{color:var(--blue);flex:none;margin-top:1px}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:24px;display:block;margin:6px 0 14px;background:var(--mist)}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--mist);border-top-color:var(--blue);animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.scan{position:relative;border-radius:24px;overflow:hidden;margin:6px 0 20px}
.scan img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:saturate(.7)}
.scan::after{content:"";position:absolute;left:0;right:0;height:60px;background:linear-gradient(to bottom,transparent,rgba(61,123,217,.45),transparent);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{0%{top:-60px}100%{top:100%}}
.result{text-align:center;padding:30px 24px}
.pts{font-family:"Baloo 2";font-size:64px;font-weight:800;color:var(--blue);line-height:1;margin:16px 0 4px}
.badge-ok{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);display:grid;place-items:center;margin:20px auto 0}
.badge-bad{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);display:grid;place-items:center;margin:20px auto 0}
.note{font-size:12.5px;color:var(--ink2);background:var(--mist2);border-radius:12px;padding:10px 12px;margin:14px 0}

/* ---------- profile ---------- */
.av{border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;flex:none;text-transform:uppercase}
.av.ring{box-shadow:0 0 0 3px var(--frame),0 0 0 6px var(--c)}
.prof-head{display:flex;align-items:center;gap:18px;padding:8px 22px 4px}
.prof-head .who b{display:block;font-size:20px;font-family:"Baloo 2";font-weight:700}
.prof-head .who small{display:block}
.stats{display:flex;gap:6px;padding:16px 16px 8px}
.stats div{flex:1;text-align:center;background:var(--surface);border-radius:14px;padding:8px 2px}
.stats b{display:block;font-family:"Baloo 2";font-size:20px;line-height:1.1}
.stats span{font-size:11.5px;color:var(--ink2);line-height:1.2;display:block}
.seg{display:flex;margin:10px 16px 12px;background:var(--mist);border-radius:14px;padding:4px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--blue-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.troph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:4px 16px 30px}
.troph{text-align:center;font-size:12px;font-weight:600;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;align-self:start}
.troph svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px 30px}
.pg{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--c);display:grid;place-items:center;color:#fff}
.pg img{width:100%;height:100%;object-fit:cover}
.pg svg.hx{width:70%;height:70%}
.follow{height:36px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.follow.off{background:var(--mist);color:var(--blue-d)}
.amb-tab{padding:0 16px 30px;display:flex;flex-direction:column;gap:8px}
.amb-tab .amb-row{padding:10px 12px}
.amb-tab .circ{width:46px;height:46px}

/* ---------- settings ---------- */
.set-group{margin:6px 16px 16px;background:var(--surface);border-radius:18px;overflow:hidden}
.set-group h4{margin:0;padding:12px 16px 4px;font-size:13px;color:var(--ink2);font-weight:600}
.set-item{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.set-item:first-of-type{border-top:0}
.set-item .grow{flex:1}
.set-item small{display:block;font-size:12.5px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:6px 16px 16px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface),0 0 0 2px transparent}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.set-pad{padding:4px 16px 16px}

/* ---------- feed ---------- */
.search{position:relative;margin:2px 14px 14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 40px 0 42px;font-size:15px;outline:none}
.search input:focus{border-color:var(--blue)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.ures{padding:0 14px 30px;display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px}
.urow .who{flex:1;min-width:0;text-align:left}
.urow .who b{display:block}
.urow .who small{display:block;font-size:12.5px}
.feed{padding:0 14px 30px;display:flex;flex-direction:column;gap:14px}
.post{background:var(--surface);border-radius:22px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-h .who{flex:1;min-width:0}
.post-h .who b{display:block;font-size:15px}
.post-h .who small{font-size:12px;display:block}
.post-media{position:relative}
.post-media img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.ph{aspect-ratio:16/10;background:color-mix(in srgb,var(--c) 14%,var(--surface));display:grid;place-items:center;color:var(--c)}
.ph .big{width:92px;height:92px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.trophy-media{aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface) 70%)}
.trophy-media svg{width:128px;height:128px}
.rep-media{margin:0 14px;padding:16px;border-radius:18px;background:linear-gradient(145deg,var(--blue),#6FA8F0);color:#fff}
.rep-media h3{color:#fff}
.rep-media .rs{display:flex;gap:10px;margin-top:12px}
.rep-media .rs div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:8px}

function durMin(a){let s=a.sh*60+a.sm,e=a.eh*60+a.em;if(e<=s)e+=1440;return e-s}
function startTs(a,k){const d=pk(k);d.setHours(a.sh,a.sm,0,0);return d.getTime()}
function endTs(a,k){return startTs(a,k)+durMin(a)*6e4}
function occursOn(a,k){
 if(k<a.date)return false;if(!a.repeat)return k===a.date;
 if(a.freq==='diaria')return true;
 if(a.freq==='semanal')return dayDiff(a.date,k)%7===0;
 const n={mensal:1,bimestral:2,trimestral:3,quadrimestral:4,semestral:6,anual:12}[a.freq]||1;
 const s=pk(a.date),d=pk(k);const md=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();
 return md%n===0&&d.getDate()===s.getDate()}
function activitiesOn(u,k){return u.activities.filter(a=>occursOn(a,k)).sort((a,b)=>(a.sh*60+a.sm)-(b.sh*60+b.sm))}
function doneOf(u,id,k){return u.completions.find(c=>c.actId===id&&c.date===k)}
function ambOf(u,id){return u.ambits.find(a=>a.id===id)||{id,name:'Âmbito removido',color:'#93A1B8',icon:'star'}}

const STREAKS=[[7,'primeira semana','sua primeira semana'],[30,'30 dias','30 dias'],[60,'60 dias','60 dias'],[90,'90 dias','90 dias'],[365,'1 ano','1 ano'],[548,'1 ano e meio','1 ano e meio'],[730,'2 anos','2 anos'],[913,'2 anos e meio','2 anos e meio']];
const useDay=c=>dk(new Date(c.at||Date.now()));
function streakOf(u,endKey){const days=new Set(u.completions.map(useDay));let n=0,k=endKey||today();
 if(!endKey&&!days.has(k))k=addDays(k,-1); // hoje ainda sem tarefa: a sequência vale até ontem
 while(days.has(k)){n++;k=addDays(k,-1)}return n}
function checkTrophies(u,c){const out=[];const done=u.completions;
 const day=useDay(c);const firstOfDay=done.filter(x=>useDay(x)===day).length===1;
 if(firstOfDay){const s=streakOf(u,day);const m=STREAKS.find(x=>x[0]===s);
  if(m&&!u.trophies.some(t=>t.type==='ofensiva'&&t.streak===m[0]))out.push({type:'ofensiva',streak:m[0],name:`Ofensiva: ${m[1]}`,desc:`${m[0]} dias seguidos usando o LifeQuest, com pelo menos uma tarefa concluída por dia.`})}
 const na=done.filter(x=>x.ambitId===c.ambitId).length;
 if(na%5===0)out.push({type:'habito',name:na===5?`Novo hábito: ${c.ambitName}`:`${c.ambitName}: ${na} atividades`,desc:`${na} atividades de ${c.ambitName} concluídas. Um novo hábito está nascendo.`});
 const key=c.title.trim().toLowerCase();const ns=done.filter(x=>x.title.trim().toLowerCase()===key).length;
 if(ns%30===0)out.push({type:'frequencia',name:`Frequência: ${c.title}`,desc:`Você concluiu "${c.title}" ${ns} vezes. Isso já faz parte de quem você é.`});
 out.forEach(t=>{t.id=uid();t.at=c.at||Date.now();u.trophies.push(t)});return out}

/* Fora do Claude: cole aqui o endereço do seu servidor intermediário (ver lifequest-ia-worker.js).
   Ex.: const AI_PROXY_URL='https://lifequest-ia.seu-usuario.workers.dev'; Vazio = validação simulada. */
const AI_PROXY_URL='';
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('leitura'));r.readAsDataURL(b)})}
function proxySample(){
 const call=async(prompt,opts={})=>{const b=opts.images&&opts.images[0];const image=b?{media_type:b.type||'image/jpeg',data:await blobToB64(b)}:null;
  let r;try{r=await fetch(AI_PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,image,tier:opts.modelTier||'default'})})}catch(e){throw{code:'network',message:'Sem conexão com o servidor de IA'}}
  if(!r.ok)throw{code:r.status===429?'rate_limited':'failed',message:'Servidor de IA respondeu '+r.status};
  const j=await r.json();return{text:String(j.text||''),truncated:false}};
 call.json=async(prompt,opts)=>{const{text}=await call(prompt,opts);const t=text.replace(/```json|```/g,'');const a=t.indexOf('{'),z=t.lastIndexOf('}');if(a<0||z<a)throw{code:'bad_json',message:'Resposta sem JSON'};return JSON.parse(t.slice(a,z+1))};
 call.limits=async()=>({images:{maxCount:1}});call.isProxy=true;
 return call}
let samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=((window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null)).then(s=>s||(AI_PROXY_URL?proxySample():null));return samplePromise}

function maxPrio(n){return n>=3?2:n===2?1:0}

 const canStar=id=>{const s=AMB.sel[id];if(s&&s.priority)return true;return np<maxPrio(n+(s?0:1))};
 const row=a=>{const on=!!AMB.sel[a.id];const pr=on&&AMB.sel[a.id].priority;
  return`<div class="amb-row ${on?'on':''}" style="--c:${a.color}">

function ambToggle(id){const u=me();
 if(AMB.sel[id]){if(u.activities.some(a=>a.ambitId===id)){toast('Este âmbito tem atividades. Exclua-as antes de removê-lo.');return}delete AMB.sel[id]}

function ambPrio(id){const s=AMB.sel[id];if(s&&s.priority){s.priority=false;keepScroll(render);return}
 const n=Object.keys(AMB.sel).length+(s?0:1);const np=Object.values(AMB.sel).filter(x=>x.priority).length;const mp=maxPrio(n);
 if(np>=mp){toast(mp===0?'Selecione pelo menos dois âmbitos para ter uma prioridade.':mp===1?'Com dois âmbitos, só um pode ser prioridade.':'Você pode ter até duas prioridades.');return}

S.home=()=>{const u=me();const sel=UI.sel;const [y,m]=UI.vm.split('-').map(Number);

 const time=fmtT(a.sh,a.sm)+(a.hasEnd?` – ${fmtT(a.eh,a.em)}`:'');

   <small class="hint">Escolha quantos quiser, ou nenhum. No horário de início você sempre recebe uma notificação.</small></div>
  <p class="err" id="na-err"></p>

function saveAct(){const u=me();const p=R.p;const g=id=>$(id);
 const a={ambitId:g('#na-amb').value,title:g('#na-title').value.trim(),date:g('#na-date').value,sh:+g('#na-sh').value,sm:+g('#na-sm').value,hasEnd:g('#na-hasend').checked,eh:+g('#na-eh').value,em:+g('#na-em').value,repeat:g('#na-rep').checked,freq:g('#na-freq').value,rem:Object.keys(REM).filter(k=>g('#na-r'+k).checked)};
 if(!a.title){g('#na-err').textContent='Dê um nome para a atividade.';return}
 if(!a.date){g('#na-err').textContent='Escolha a data.';return}
 if(a.hasEnd&&a.eh*60+a.em===a.sh*60+a.sm){g('#na-err').textContent='O término precisa ser diferente do início.';return}
 if(p.editId){Object.assign(u.activities.find(x=>x.id===p.editId),a);save();back();toast('Atividade atualizada.');return}
 const act=mkAct(a);u.activities.push(act);
 if(p.sugg){const rep=u.reports.find(r=>r.id===p.sugg.rid);if(rep)rep.data.ai.atividades[p.sugg.i].status='aceita';}
 save();UI.sel=a.date;UI.vm=a.date.slice(0,7);
 if(p.sugg){back();toast('Sugestão adicionada ao calendário.')}else{tab('home');toast('Atividade salva.')}}

S.activity=p=>{const u=me();const a=u.activities.find(x=>x.id===p.id);if(!a)return S.home();const am=ambOf(u,a.ambitId);const k=p.date;
 const done=doneOf(u,a.id,k);const run=isRunning(u,a.id,k);const fut=k>today();
 return`<header class="bar"><button class="ib" onclick="back()" aria-label="Voltar">${ic('back',24)}</button><h2></h2><button class="ib" aria-label="Editar atividade" onclick="go('newact',{editId:'${a.id}',prefill:me().activities.find(x=>x.id==='${a.id}')})">${ic('edit',20)}</button></header>
 <div class="det" style="--c:${am.color}">

   <div><span>Pontos ao concluir</span><b>${am.priority?20:10}</b></div>
  </div>
  ${done||fut?'':`<div class="center" style="margin-top:12px"><button class="link small" onclick="demoNotif('${a.id}','${k}')">${ic('bell',14)} Simular notificação de início</button></div>`}
  <div class="center"><button class="link small" style="color:var(--bad)" onclick="delAct('${a.id}')">Excluir atividade</button></div>
 </div>`};
function isRunning(u,id,k){return u.running&&u.running.actId===id&&u.running.date===k}
function startActivity(id,k){const u=me();u.running={actId:id,date:k,startedAt:Date.now()};save();NQ=null;
 if(R.name==='activity')render();else renderNotif();toast('Atividade iniciada.')}
function delAct(id){confirmBox('Excluir atividade?','Ela some do calendário, inclusive das próximas repetições. O histórico de conclusões e troféus é mantido.','Excluir',()=>{const u=me();u.activities=u.activities.filter(a=>a.id!==id);if(u.running&&u.running.actId===id)u.running=null;save();back();toast('Atividade excluída.')})}
function clockState(u,a,k){const done=doneOf(u,a.id,k);if(done)return{t:'Feito!',l:'Atividade concluída',cls:'done',pr:1};
 const run=isRunning(u,a.id,k)?u.running:null;
 if(!run)return{t:a.hasEnd?fmtDur(durMin(a)*6e4):'00:00:00',l:'Não iniciada',cls:'',pr:0};
 if(a.hasEnd){const end=endTs(a,k);const rem=end-Date.now();const total=Math.max(end-run.startedAt,1);
  return rem>=0?{t:fmtDur(rem),l:'Tempo restante',cls:'',pr:1-rem/total}:{t:'-'+fmtDur(-rem),l:'Além do horário previsto',cls:'over',pr:1}}
 return{t:fmtDur(Date.now()-run.startedAt),l:'Tempo decorrido',cls:'',pr:((Date.now()-run.startedAt)%36e5)/36e5}}
function updateClocks(){const u=me();if(!u)return;
 if(R.name==='activity'){const a=u.activities.find(x=>x.id===R.p.id);const el=$('#clock');if(a&&el){const s=clockState(u,a,R.p.date);
  el.className='clock '+s.cls;$('#ct').textContent=s.t;$('#cl').textContent=s.l;$('#ring').setAttribute('stroke-dashoffset',666*(1-Math.min(1,Math.max(0,s.pr))));if(s.cls==='over')$('#ring').setAttribute('stroke','var(--bad)')}}
 const nc=$('#nclock');if(nc&&u.running){const a=u.activities.find(x=>x.id===u.running.actId);if(a){const s=clockState(u,a,u.running.date);nc.textContent=s.t;nc.className='ntf-clock '+s.cls}}}

/* ---- notificações (simuladas no app) ---- */
let NQ=null,nTimer=null;const fired=new Set();
function notify(n){NQ=n;renderNotif();clearTimeout(nTimer);if(n.kind==='reminder')nTimer=setTimeout(()=>{if(NQ===n){NQ=null;renderNotif()}},9000)}
function renderNotif(){const el=$('#notif');const u=me();if(!u){el.innerHTML='';return}
 let n=NQ;if(!n&&u.running&&!(R.name==='activity'&&isRunning(u,R.p.id,R.p.date))){const a=u.activities.find(x=>x.id===u.running.actId);if(a)n={kind:'running',a,k:u.running.date};else u.running=null}
 if(!n){el.innerHTML='';return}
 const head=`<div class="ntf-h"><span class="app">${ic('check',13,'stroke="#fff" stroke-width="3"')}</span>LifeQuest, agora${n.kind!=='running'?`<button class="x" onclick="NQ=null;renderNotif()" aria-label="Dispensar">${ic('x',14)}</button>`:''}</div>`;
 const open=`onclick="NQ=null;go('activity',{id:'${n.a.id}',date:'${n.k}'})"`;
 if(n.kind==='reminder')el.innerHTML=`<div class="ntf" role="alert">${head}<div class="ntf-b" ${open}><b>${esc(n.a.title)}</b><span>${n.body}</span></div></div>`;
 else if(n.kind==='start')el.innerHTML=`<div class="ntf" role="alert">${head}<div class="ntf-b" ${open}><b>Hora de começar: ${esc(n.a.title)}</b><span>${fmtT(n.a.sh,n.a.sm)}${n.a.hasEnd?` às ${fmtT(n.a.eh,n.a.em)}`:''}</span></div>
  <div class="ntf-a"><button onclick="snooze('${n.a.id}','${n.k}')">Adiar 10 min</button><button class="p" onclick="startActivity('${n.a.id}','${n.k}')">Iniciar</button></div></div>`;
 else el.innerHTML=`<div class="ntf">${head}<div class="ntf-b" ${open} style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>${esc(n.a.title)}</b><span>${n.a.hasEnd?'Até o fim da atividade':'Em andamento'}</span></div><span class="ntf-clock" id="nclock"></span></div></div>`;
 updateClocks()}
function snooze(id,k){const u=me();u.snoozes.push({actId:id,date:k,at:Date.now()+6e5});save();NQ=null;renderNotif();toast('Combinado. Avisamos de novo em 10 minutos.')}
function demoNotif(id,k){const u=me();const a=u.activities.find(x=>x.id===id);notify({kind:'start',a,k})}
function checkSchedule(){const u=me();if(!u||!u.onboarded)return;const now=Date.now();const t=today();
 for(const k of [t,addDays(t,1)])for(const a of activitiesOn(u,k)){if(doneOf(u,a.id,k))continue;const st=startTs(a,k);
  const evs=[];if(a.rem.includes('1d'))evs.push([st-864e5,'1d','Começa amanhã às '+fmtT(a.sh,a.sm)]);if(a.rem.includes('1h'))evs.push([st-36e5,'1h','Começa em 1 hora']);if(a.rem.includes('10m'))evs.push([st-6e5,'10m','Começa em 10 minutos']);
  for(const[ts,tag,body]of evs){const key=a.id+k+tag;if(now>=ts&&now-ts<6e4&&!fired.has(key)){fired.add(key);notify({kind:'reminder',a,k,body})}}
  const sk=a.id+k+'start';if(now>=st&&now-st<6e4&&!fired.has(sk)&&!isRunning(u,a.id,k)){fired.add(sk);notify({kind:'start',a,k})}}
 const due=u.snoozes.filter(s=>now>=s.at);if(due.length){u.snoozes=u.snoozes.filter(s=>now<s.at);save();const s=due[0];const a=u.activities.find(x=>x.id===s.actId);if(a&&!doneOf(u,a.id,s.date))notify({kind:'start',a,k:s.date})}}

function pickPhoto(){const i=$('#camInput');i.value='';i.click()}
async function gotPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;
 try{PHOTO=await downscale(f,720)}catch(e){toast('Não foi possível abrir essa imagem. Tente outra foto.');return}
 if(R.name==='proofPreview')render();else go('proofPreview',{...R.p})}
function downscale(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const dataUrl=c.toDataURL('image/jpeg',.72);c.toBlob(b=>b?res({dataUrl,blob:b}):rej(),'image/jpeg',.82)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
S.proofPreview=p=>`<header class="bar"><button class="ib" onclick="back()" aria-label="Voltar">${ic('back',24)}</button><h2>Sua foto</h2></header>
 <div class="proof"><img class="photo" src="${PHOTO?PHOTO.dataUrl:''}" alt="Selfie de comprovação">
  <label class="checkrow"><input type="checkbox" id="shareChk">Compartilhar a foto e a atividade no feed</label>
  <div class="btns"><button class="btn primary" onclick="sendProof()">Enviar para aprovação</button><button class="btn ghost" onclick="pickPhoto()">${ic('cam',20)}Tirar outra foto</button></div></div>`;
async function sendProof(){if(!PHOTO)return;const u=me();const {id,date}=R.p;const share=$('#shareChk').checked;const a=u.activities.find(x=>x.id===id);const am=ambOf(u,a.ambitId);
 R={name:'proofCheck',p:{id,date}};render();
 let res;try{res=await aiValidate(a,am,PHOTO.blob)}catch(e){res={err:true,motivo:e&&e.code==='rate_limited'?'Muitas análises seguidas. Aguarde um minuto e envie de novo.':'Não conseguimos analisar a foto agora. Tente enviar de novo.'}}
 if(R.name!=='proofCheck'||R.p.id!==id)return;
 if(res.aprovado){const out=completeAct(u,a,am,date,share);R={name:'proofDone',p:{...out,motivo:res.motivo,sim:res.simulado}};render()}
 else{R={name:'proofFail',p:{id,date,motivo:res.motivo,err:res.err}};render()}}
async function aiValidate(a,am,blob){const sim={aprovado:true,simulado:true,motivo:'Validação simulada: a IA não está configurada neste ambiente.'};
 const s=await getSample();if(!s){await sleep(2200);return sim}
 const lim=await s.limits().catch(()=>null);if(!lim||!lim.images){await sleep(1600);return sim}
 const prompt=`Você é o validador de comprovações do aplicativo LifeQuest, que transforma hábitos em jogo.
O usuário diz ter concluído a atividade "${a.title}" (âmbito: ${am.name}).
Analise a foto anexada e aprove SOMENTE se as duas condições forem verdadeiras:
1) É uma selfie ou foto em que o rosto de uma pessoa aparece de forma visível.
2) O fundo ou a cena mostra evidência plausível relacionada à atividade (ex.: aparelho de academia para treino, cama arrumada para arrumar a cama, livro para leitura, remédio para tomar medicamento).
Seja razoável: não exija perfeição, mas rejeite fotos sem rosto, fotos de tela, imagens claramente não relacionadas ou genéricas.
Responda APENAS com JSON, sem texto extra: {"aprovado": true ou false, "motivo": "uma frase curta em português, falando diretamente com o usuário"}`;
 try{const r=await s.json(prompt,{images:[blob],modelTier:'quick',cache:false});return{aprovado:r&&r.aprovado===true,motivo:String((r&&r.motivo)||'')}}
 catch(e){if(e&&e.code==='not_granted'){await sleep(600);return{...sim,motivo:'Você não autorizou a análise por IA, então a validação foi simulada.'}}
  if(s.isProxy)return{...sim,motivo:'A IA está indisponível agora (cota gratuita do dia esgotada ou sem conexão), então a validação foi simulada.'};throw e}}
let TQ=[];
function completeAct(u,a,am,k,share){const run=isRunning(u,a.id,k)?u.running:null;
 const mins=run?Math.max(1,Math.round((Date.now()-run.startedAt)/6e4)):a.hasEnd?durMin(a):30;
 const pts=am.priority?20:10;const c={id:uid(),actId:a.id,date:k,at:Date.now(),title:a.title,ambitId:am.id,ambitName:am.name,points:pts,minutes:mins};
 u.completions.push(c);u.points+=pts;u.coins+=pts;if(run)u.running=null;
 const tro=checkTrophies(u,c);TQ=tro.slice();
 if(share)addPost({type:'activity',title:a.title,ambitId:am.id,ambitName:am.name,color:am.color,icon:am.icon,photo:PHOTO.dataUrl,points:pts});
 save();return{pts,title:a.title,color:am.color}}

function toggleFollow(un){const v=me();const o=db.users[un];

function changeUser(){const u=me();const n=$('#xu').value.trim().toLowerCase();const h=$('#xuh');
 if(n===u.username){h.textContent='Esse já é o seu nome de usuário.';return}
 if(!userOk(n)){h.style.color='var(--bad)';h.textContent='Use de 3 a 20 caracteres: a-z, 0-9, ponto ou sublinhado.';return}
 if(db.users[n]){h.style.color='var(--bad)';h.textContent=`@${n} já está em uso. Tente outro.`;return}
 const old=u.username;u.username=n;delete db.users[old];db.users[n]=u;
 Object.values(db.users).forEach(x=>{x.following=x.following.map(y=>y===old?n:y);x.followers=x.followers.map(y=>y===old?n:y);x.events.forEach(e=>{if(e.who===old)e.who=n})});
 db.posts.forEach(p=>{if(p.user===old)p.user=n;p.likes=p.likes.map(y=>y===old?n:y);p.hearts=p.hearts.map(y=>y===old?n:y)});
 db.session=n;save();render();toast(`Agora você é @${n}.`)}

function userResults(q){const v=me();q=q.trim().toLowerCase().replace(/^@/,'');if(!q)return'';
 const list=Object.values(db.users).filter(u=>u.username.includes(q)||(u.showName&&u.name&&u.name.toLowerCase().includes(q)))
  .sort((a,b)=>(a.username.startsWith(q)?0:1)-(b.username.startsWith(q)?0:1)||a.username.localeCompare(b.username)).slice(0,20);
 if(!list.length)return`<div class="empty">Nenhum usuário encontrado para "${esc(q)}".<br>Confira a grafia do @.</div>`;
 return list.map(u=>{const self=u.username===v.username;const fol=v.following.includes(u.username);

function postHTML(p,v){const u=db.users[p.user];const self=u.username===v.username;const fol=v.following.includes(u.username);

 while(out.length<5&&i<40){const a=am[i%am.length];const list=IDEAS[a.id]||[[`Sessão de ${a.name}`,18,0,19,0,'semanal',['1h']]];const it=list[Math.floor(i/am.length)%list.length];
  if(!has.has(it[0].toLowerCase())&&!out.find(o=>o.title===it[0])){out.push({ambitId:a.id,title:it[0],date:addDays(today(),1),sh:it[1],sm:it[2],hasEnd:!!(it[3]||it[4]),eh:it[3],em:it[4],repeat:true,freq:it[5],rem:it[6],motivo:a.priority?`Reforça ${a.name}, um dos seus âmbitos prioritários.`:`Equilibra sua rotina em ${a.name}.`})}i++}
 return{atividades:out,habitos:['Separar a roupa do dia seguinte antes de dormir','Deixar o celular fora do quarto','Anotar 3 coisas boas do dia'],
  exercicios:['Prancha de 30 segundos, 3 séries','Agachamento livre, 3 séries de 12','Pular corda por 5 minutos'],hobbies:['Fotografia com o celular','Cozinhar uma receita nova por semana','Montar quebra-cabeças'],sim:true}}
async function genSuggestions(u,rep){let ai=null;const s=await getSample();
 if(s){const ctx={hoje:today(),ambitos:u.ambits.map(a=>({id:a.id,nome:a.name,prioridade:a.priority})),
  atividades_atuais:u.activities.map(a=>({titulo:a.title,ambito:a.ambitId,inicio:fmtT(a.sh,a.sm),fim:a.hasEnd?fmtT(a.eh,a.em):null,frequencia:a.repeat?a.freq:null})),
  conclusoes_no_mes_por_ambito:rep.data.byAmb,mais_frequentes:rep.data.top};
  const prompt=`Você é o motor de recomendações do app de hábitos gamificado LifeQuest. Com base no comportamento do usuário abaixo, sugira 5 novas atividades (diferentes das atuais), além de novos hábitos, exercícios e hobbies que ele possa gostar. Priorize âmbitos marcados como prioridade e equilibre âmbitos pouco praticados. Escolha horários que não conflitem com as atividades atuais.
DADOS: ${JSON.stringify(ctx)}
Responda APENAS com JSON válido, sem texto extra, neste formato:
{"atividades":[{"ambito_id":"um id da lista de ambitos","titulo":"até 40 caracteres","data":"YYYY-MM-DD a partir de amanhã","inicio":"HH:MM","fim":"HH:MM ou null","frequencia":"diaria|semanal|mensal|bimestral|trimestral|quadrimestral|semestral|anual ou null","lembretes":["1d","1h","10m" — qualquer subconjunto],"motivo":"uma frase curta"}],"habitos":["3 itens"],"exercicios":["3 itens"],"hobbies":["3 itens"]}
Exatamente 5 atividades. Minutos em múltiplos de 5. Tudo em português do Brasil.`;
  try{const j=await s.json(prompt,{modelTier:'default'});ai=normalizeAI(u,j)}catch(e){ai=null}}
 if(!ai)ai=fallbackSug(u);
 rep.data.ai=ai;save();if(R.name==='report'&&R.p.id===rep.id)keepScroll(render)}
function normalizeAI(u,j){if(!j||!Array.isArray(j.atividades))return null;const ids=u.ambits.map(a=>a.id);const tm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');if(!m)return null;return[Math.min(23,+m[1]),Math.round(Math.min(55,+m[2])/5)*5]};
 const acts=j.atividades.slice(0,5).map(x=>{const st=tm(x.inicio)||[8,0];const en=tm(x.fim);const amb=ids.includes(x.ambito_id)?x.ambito_id:ids[0];
  return{ambitId:amb,title:String(x.titulo||'Nova atividade').slice(0,60),date:/^\d{4}-\d{2}-\d{2}$/.test(x.data||'')&&x.data>today()?x.data:addDays(today(),1),sh:st[0],sm:st[1],hasEnd:!!en,eh:en?en[0]:st[0]+1,em:en?en[1]:0,repeat:!!FREQ[x.frequencia],freq:FREQ[x.frequencia]?x.frequencia:'diaria',rem:(x.lembretes||[]).filter(r=>REM[r]),motivo:String(x.motivo||'')}});
 if(acts.length<5){const fb=fallbackSug(u).atividades;while(acts.length<5&&fb.length)acts.push(fb.shift())}
 const arr=a=>Array.isArray(a)&&a.length?a.slice(0,4).map(String):null;const fb=fallbackSug(u);
 return{atividades:acts,habitos:arr(j.habitos)||fb.habitos,exercicios:arr(j.exercicios)||fb.exercicios,hobbies:arr(j.hobbies)||fb.hobbies}}

function openModal(html){const m=$('#modal');m.innerHTML=html;m.classList.add('open');const f=m.querySelector('input,button.btn');if(f&&f.tagName==='INPUT'&&f.type!=='checkbox')setTimeout(()=>f.focus(),60)}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML=''}
let CB=null;
function confirmBox(t,txt,ok,fn){CB=fn;openModal(`<div class="scrim" onclick="closeModal()"></div><div class="sheet" role="dialog" aria-label="${esc(t)}"><h3>${esc(t)}</h3><p>${esc(txt)}</p>
 <div class="btns"><button class="btn primary" onclick="closeModal();CB&&CB()">${esc(ok)}</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div></div>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal()});
